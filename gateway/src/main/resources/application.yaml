spring:
  application:
    name: gateway
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  main:
    banner-mode: off

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

gateway:
  grpc-deadline: ${GATEWAY_GRPC_DEADLINE:3s}
  services:
    plaintext: ${GATEWAY_GRPC_PLAINTEXT:true}
    auth-target: ${GATEWAY_AUTH_TARGET:localhost:9090}
    card-catalog-target: ${GATEWAY_CARD_CATALOG_TARGET:localhost:9091}
  jwt:
    issuer: ${GATEWAY_JWT_ISSUER:https://auth.vendex.local}
    cache-ttl: ${GATEWAY_JWKS_CACHE_TTL:5m}
    stale-ttl: ${GATEWAY_JWKS_STALE_TTL:1h}
    clock-skew: ${GATEWAY_JWT_CLOCK_SKEW:30s}
  rate-limit:
    edge-requests: ${GATEWAY_EDGE_RATE_LIMIT:300}
    public-requests: ${GATEWAY_PUBLIC_RATE_LIMIT:20}
    authenticated-requests: ${GATEWAY_AUTHENTICATED_RATE_LIMIT:120}
    window: ${GATEWAY_RATE_LIMIT_WINDOW:1m}
  cors:
    allowed-origins: ${GATEWAY_CORS_ALLOWED_ORIGINS:http://localhost:3000}

logging:
  level:
    com.vendex: INFO
    io.grpc: WARN
