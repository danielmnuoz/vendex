spring:
  application:
    name: buylist
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/buylist_db}
    username: ${SPRING_DATASOURCE_USERNAME:vendex}
    password: ${SPRING_DATASOURCE_PASSWORD:vendex}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/outbox
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
    consumer:
      group-id: ${BUYLIST_ROSTER_CONSUMER_GROUP:buylist-roster-projection}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  main:
    web-application-type: none
    banner-mode: off

grpc:
  server:
    port: ${GRPC_SERVER_PORT:9090}

buylist:
  card-catalog-target: ${BUYLIST_CARD_CATALOG_TARGET:localhost:9091}

vendex:
  outbox:
    enabled: true
    batch-size: 100
    poll-interval-ms: 250

logging:
  level:
    com.vendex: INFO
    org.springframework.jdbc.core: WARN
