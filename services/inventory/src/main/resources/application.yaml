spring:
  application:
    name: inventory
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/inventory_db}
    username: ${SPRING_DATASOURCE_USERNAME:vendex}
    password: ${SPRING_DATASOURCE_PASSWORD:vendex}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/outbox
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
  main:
    web-application-type: none
    banner-mode: off

grpc:
  server:
    port: ${GRPC_SERVER_PORT:9090}
    # CSV content is carried in the protobuf request. Keep transport capacity
    # above the 5 MiB application limit so validation, not gRPC, owns the error.
    max-inbound-message-size: 6MB

inventory:
  card-catalog-target: ${INVENTORY_CARD_CATALOG_TARGET:localhost:9091}
  csv:
    max-rows: ${INVENTORY_CSV_MAX_ROWS:1000}
    max-bytes: ${INVENTORY_CSV_MAX_BYTES:5242880}
  matching:
    auto-match-threshold: ${INVENTORY_MATCH_THRESHOLD:0.82}
    ambiguity-gap: ${INVENTORY_MATCH_AMBIGUITY_GAP:0.05}

vendex:
  outbox:
    enabled: true
    batch-size: 100
    poll-interval-ms: 250

logging:
  level:
    com.vendex: INFO
    org.springframework.jdbc.core: WARN
